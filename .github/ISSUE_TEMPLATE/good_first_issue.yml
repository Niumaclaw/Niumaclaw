name: Good First Issue
description: 提议一个适合新贡献者上手的小任务。
title: "[Good First Issue]: "
labels: ["good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: 任务内容
      placeholder: 例如：补充 team_config.example.json 示例配置。
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 完成后有什么价值
      placeholder: 例如：新用户可以更快启动项目。
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 可能涉及的文件
      placeholder: README.md, docs/, .github/ 等
