name: Bug Report
description: 报告 NiumaClaw 中可复现的问题。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供复现步骤和截图，这能帮助更快定位问题。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明发生了什么。
      placeholder: 例如：点击项目看板后页面空白。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 dotnet run
        2. 打开 http://localhost:4050/
        3. 点击 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11, .NET 10.0.201, Chrome 版本等
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可以粘贴错误日志，或上传截图。
